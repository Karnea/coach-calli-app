/* ================= FUSION ================= */
/* Fusion sans perte : on garde l'union des entrées des deux côtés.
   Une entrée est identifiée par date + valeurs, ce qui évite les doublons
   tout en conservant plusieurs séries du même jour. */
function entryKey(e){
  var nsets=(e.sets&&e.sets.length)?e.sets.length:0;
  var sig="";
  if(e.sets&&e.sets.length){ sig=e.sets.map(function(s){ return (s.load==null?"":s.load)+"x"+(s.reps==null?"":s.reps)+"l"+(s.levelIdx==null?"":s.levelIdx); }).join(","); }
  return [e.date, e.load==null?"":e.load, e.reps==null?"":e.reps, e.levelIdx==null?"":e.levelIdx, nsets, sig].join("|");
}
function mergeLogs(a,b){
  var out={};
  var ids={};
  Object.keys(a||{}).forEach(function(k){ ids[k]=1; });
  Object.keys(b||{}).forEach(function(k){ ids[k]=1; });
  Object.keys(ids).forEach(function(id){
    var seen={}, list=[];
    ((a&&a[id])||[]).concat((b&&b[id])||[]).forEach(function(e){
      var k=entryKey(e);
      if(!seen[k]){ seen[k]=1; list.push(e); }
    });
    list.sort(function(x,y){ return x.date<y.date?-1:x.date>y.date?1:0; });
    if(list.length) out[id]=list;
  });
  return out;
}
function mergeBody(a,b){
  var byDate={};
  (a||[]).concat(b||[]).forEach(function(x){
    var cur=byDate[x.date]||{date:x.date,weight:null,waist:null};
    if(x.weight!=null) cur.weight=x.weight;
    if(x.waist!=null) cur.waist=x.waist;
    byDate[x.date]=cur;
  });
  return Object.keys(byDate).sort().map(function(d){ return byDate[d]; });
}

function loadFirebase(){
  return new Promise(function(resolve,reject){
    if(!CLOUD_ENABLED){ reject(new Error("Config Firebase absente")); return; }
    var mod = "https://www.gstatic.com/firebasejs/10.12.2/";
    var code =
      "import { initializeApp } from '"+mod+"firebase-app.js';" +
      "import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signInWithCredential, getRedirectResult, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence, indexedDBLocalPersistence } from '"+mod+"firebase-auth.js';" +
      "import { getFirestore, doc, setDoc, getDoc, onSnapshot, enableIndexedDbPersistence } from '"+mod+"firebase-firestore.js';" +
      "window.__fb = { initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signInWithCredential, getRedirectResult, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence, indexedDBLocalPersistence, getFirestore, doc, setDoc, getDoc, onSnapshot, enableIndexedDbPersistence };" +
      "window.dispatchEvent(new Event('fbready'));";
    var s=document.createElement("script");
    s.type="module";
    s.textContent=code;
    window.addEventListener("fbready",function(){ resolve(window.__fb); },{once:true});
    s.onerror=function(){ reject(new Error("Chargement Firebase impossible")); };
    document.head.appendChild(s);
    setTimeout(function(){ if(!window.__fb) reject(new Error("Firebase n'a pas répondu")); },12000);
  });
}

function initCloud(){
  if(!CLOUD_ENABLED){ setSync("local"); return; }
  setSync("connecting");
  loadFirebase().then(function(fb){
    var app=fb.initializeApp(FIREBASE_CONFIG);
    FB.app=app;
    FB.auth=fb.getAuth(app);
    FB.db=fb.getFirestore(app);
    FB.doc=fb.doc; FB.setDoc=fb.setDoc; FB.getDoc=fb.getDoc; FB.onSnapshot=fb.onSnapshot;
    FB.provider=new fb.GoogleAuthProvider();
    FB.provider.setCustomParameters({ prompt:"select_account" });
    FB.signInWithPopup=fb.signInWithPopup;
    FB.signInWithRedirect=fb.signInWithRedirect;
    FB.signOut=fb.signOut;

    try{ fb.enableIndexedDbPersistence(FB.db).catch(function(){}); }catch(e){}

    /* La session doit survivre à la fermeture de l'app (mode standalone iOS).
       IndexedDB d'abord, localStorage en repli. */
    var persistReady = fb.setPersistence(FB.auth, fb.indexedDBLocalPersistence)
      .catch(function(){ return fb.setPersistence(FB.auth, fb.browserLocalPersistence); })
      .catch(function(){});

    persistReady.then(function(){
      /* En app native : la session est gérée par le plugin natif. On tente
         d'abord de récupérer l'utilisateur courant côté natif, ce qui couvre
         le cas "déjà connecté" au redémarrage de l'app. */
      if(nativeAuthAvailable()){
        return; /* onAuthStateChanged (ci-dessous) recevra l'utilisateur propagé */
      }
      /* En PWA : récupère le résultat si on revient d'une redirection. */
      var pending=false;
      try{ pending = localStorage.getItem("coachCalli.redirectPending")==="1"; }catch(_){}
      return fb.getRedirectResult(FB.auth).then(function(res){
        try{ localStorage.removeItem("coachCalli.redirectPending"); }catch(_){}
        if(pending && !res){
          setSync("err","La connexion n'a pas abouti au retour de Google. Ouvre l'app dans Safari plutôt que depuis l'icône, connecte-toi, puis reviens.");
        }
      }).catch(function(e){
        try{ localStorage.removeItem("coachCalli.redirectPending"); }catch(_){}
        setSync("err", e && e.message ? e.message : "Retour de connexion invalide");
      });
    }).then(function(){
      fb.onAuthStateChanged(FB.auth,function(user){
        if(user){ onSignedIn(user); }
        else{ SYNC.user=null; if(FB.unsub){FB.unsub();FB.unsub=null;} FB.docRef=null; if(SYNC.state!=="err") setSync("signedout"); render(); }
      });
    });
  }).catch(function(e){
    setSync("err", e.message);
    render();
  });
}

function onSignedIn(user){
  SYNC.user={uid:user.uid,name:user.displayName||user.email,photo:user.photoURL};
  FB.docRef=FB.doc(FB.db,"users",user.uid,"data","carnet");
  setSync("connecting");

  FB.getDoc(FB.docRef).then(function(snap){
    var remote=snap.exists()?snap.data():null;
    var hadLocal=Object.keys(LOGS).length>0 || BODY.length>0;

    if(remote){
      applyingRemote=true;
      LOGS=mergeLogs(LOGS, remote.logs||{});
      BODY=mergeBody(BODY, remote.body||[]);
      if(remote.meta && remote.meta.week) META.week=Math.max(META.week||1, remote.meta.week);
      applyingRemote=false;
      localSave();
      if(hadLocal) pushNow(); else { SYNC.lastSync=Date.now(); setSync("ok"); }
    } else {
      pushNow();
    }
    listenRemote();
    render();
  }).catch(function(e){
    setSync("err", e && e.message ? e.message : "Lecture impossible");
    render();
  });
}

function listenRemote(){
  if(FB.unsub){ FB.unsub(); }
  FB.unsub=FB.onSnapshot(FB.docRef,function(snap){
    if(!snap.exists()) return;
    var src=snap.metadata.hasPendingWrites;
    if(src) return;
    var r=snap.data();
    applyingRemote=true;
    var before=JSON.stringify([LOGS,BODY,META.week]);
    LOGS=mergeLogs(LOGS, r.logs||{});
    BODY=mergeBody(BODY, r.body||[]);
    if(r.meta && r.meta.week) META.week=Math.max(META.week||1, r.meta.week);
    applyingRemote=false;
    var after=JSON.stringify([LOGS,BODY,META.week]);
    localSave();
    SYNC.lastSync=Date.now(); setSync("ok");
    if(before!==after && !STATE.detail){ render(); }
  },function(e){
    setSync("err", e && e.message ? e.message : "Écoute interrompue");
  });
}

/* Connexion via le plugin natif : ouvre la vraie fenêtre Google d'Android,
   puis propage la session au Firebase JS (skipNativeAuth:false le fait tout
   seul, donc onAuthStateChanged se déclenche ensuite). En repli, on relie
   manuellement avec l'idToken renvoyé. */
function nativeSignIn(){
  setSync("connecting"); render();
  var FA=window.Capacitor.Plugins.FirebaseAuthentication;
  FA.signInWithGoogle().then(function(result){
    /* Avec skipNativeAuth:false, la session Firebase native est déjà établie
       et sera propagée. Par sécurité, si le JS n'a pas encore d'utilisateur,
       on relie via l'idToken. */
    var idToken = result && result.credential && result.credential.idToken;
    if(idToken && FB.auth && !FB.auth.currentUser && window.__fb && window.__fb.GoogleAuthProvider){
      try{
        var cred = window.__fb.GoogleAuthProvider.credential(idToken);
        if(window.__fb.signInWithCredential){
          window.__fb.signInWithCredential(FB.auth, cred).catch(function(e){
            setSync("err", e && e.message ? e.message : "Liaison de session échouée"); render();
          });
        }
      }catch(e){}
    }
  }).catch(function(e){
    var msg = e && e.message ? e.message : "Connexion refusée";
    if(/cancel/i.test(msg)){ setSync("signedout"); render(); return; }
    setSync("err", msg); render();
  });
}

function doSignIn(){
  /* App native : passage par le plugin natif (fiable, pas de page blanche). */
  if(nativeAuthAvailable()){ nativeSignIn(); return; }

  if(!FB.auth){ setSync("err","Firebase pas encore chargé, réessaie dans un instant"); render(); return; }
  setSync("connecting"); render();

  /* PWA : la popup est le flux le plus fiable ; redirect en dernier recours. */
  FB.signInWithPopup(FB.auth,FB.provider).catch(function(e){
    var code = e && e.code ? e.code : "";
    if(code==="auth/cancelled-popup-request" || code==="auth/popup-closed-by-user"){
      setSync("signedout"); render(); return;
    }
    if(code==="auth/popup-blocked" || code==="auth/operation-not-supported-in-this-environment"){
      try{ localStorage.setItem("coachCalli.redirectPending","1"); }catch(_){}
      FB.signInWithRedirect(FB.auth,FB.provider);
      return;
    }
    if(code==="auth/unauthorized-domain"){
      setSync("err","Domaine non autorisé : ajoute "+location.hostname+" dans Firebase > Authentication > Settings > Domaines autorisés");
    } else {
      setSync("err", e && e.message ? e.message : "Connexion refusée");
    }
    render();
  });
}
function doSignOut(){
  if(FB.unsub){FB.unsub();FB.unsub=null;}
  /* App native : déconnexion côté natif aussi. */
  if(nativeAuthAvailable()){
    try{ window.Capacitor.Plugins.FirebaseAuthentication.signOut(); }catch(e){}
  }
  if(FB.auth && FB.signOut){
    FB.signOut(FB.auth).then(function(){ setSync("signedout"); render(); });
  } else {
    setSync("signedout"); render();
  }
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function frDate(iso){ var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function isoWeek(d){ var date=new Date(d); date.setHours(0,0,0,0); date.setDate(date.getDate()+3-((date.getDay()+6)%7)); var w1=new Date(date.getFullYear(),0,4); return 1+Math.round(((date-w1)/86400000-3+((w1.getDay()+6)%7))/7); }

function fmtSet(s,track){
  if(track==="poids") return s.load+" kg × "+s.reps;
  if(track==="assist") return s.load+" kg aide × "+s.reps;
  if(track==="elastique") return s.level+" · "+s.reps+" reps";
  return s.reps+(s.reps>60?" s":" reps");
}
function formatEntry(e,track){
  if(e.sets && e.sets.length){
    var b=e.best||bestSet(e.sets,track);
    if(e.sets.length===1) return fmtSet(b,track);
    return fmtSet(b,track)+" · "+e.sets.length+" séries";
  }
  // rétrocompat : anciennes entrées à une seule valeur
  if(track==="poids") return e.load+" kg × "+e.reps;
  if(track==="assist") return e.load+" kg aide × "+e.reps;
  if(track==="elastique") return e.level+" · "+e.reps+" reps";
  return e.reps+(e.reps>60?" s":"");
}

/* ================= TIMER DE REPOS (minuteur natif uniquement) ================= */
/* Le timer interne PWA a été retiré : une page web ne peut pas afficher un
   compte à rebours vivant sur l'écran verrouillé. On délègue donc entièrement
   à l'app Horloge du téléphone (vrai chrono sur l'écran de veille + son garanti). */

var SHORTCUT_NAME="Repos Coach Calli";

/* Stub conservé : armAudio est appelé ailleurs (à l'enregistrement d'une série).
   Plus de son interne, donc no-op. */
function armAudio(){}

function openNativeTimer(sec){
  if(!sec) return;
  if(IS_ANDROID){ openAndroidTimer(sec); return; }
  if(IS_IOS){
    if(!META.shortcutReady){ STATE.showShortcut=sec; render(); return; }
    runShortcut(sec);
    return;
  }
  /* Plateforme inconnue : on tente l'intent Android, sinon rien. */
  openAndroidTimer(sec);
}

/* Intent Chrome Android vers l'app Horloge (AlarmClock.SET_TIMER).
   On cible explicitement le package de l'Horloge Google (Pixel & la plupart
   des Android) : sans package, Chrome ne résout pas toujours l'intent et
   bascule sur le fallback web. Avec le package, il ouvre l'app native.
   Fallback = fiche Play Store de l'Horloge (au cas où elle serait absente). */
var CLOCK_PKG="com.google.android.deskclock";
function androidTimerUrl(sec){
  var label=encodeURIComponent("Repos Coach Calli");
  var fallback=encodeURIComponent("https://play.google.com/store/apps/details?id="+CLOCK_PKG);
  return "intent:#Intent;"
    +"action=android.intent.action.SET_TIMER;"
    +"package="+CLOCK_PKG+";"
    +"i.android.intent.extra.alarm.LENGTH="+sec+";"
    +"S.android.intent.extra.alarm.MESSAGE="+label+";"
    +"B.android.intent.extra.alarm.SKIP_UI=false;"
    +"S.browser_fallback_url="+fallback+";"
    +"end";
}
/* Détecte si on tourne DANS l'app native Capacitor (et pas dans Chrome).
   Dans ce cas, un pont natif expose CoachCalliTimer : le code natif a le droit
   de lancer l'Horloge, contrairement à Chrome. */
function inNativeApp(){
  return !!(window.CoachCalliTimer && typeof window.CoachCalliTimer.start==="function")
      || !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
}
function openAndroidTimer(sec){
  /* 1) App native : on passe par le pont Kotlin, qui lance l'Horloge sans
        restriction navigateur. C'est le chemin normal une fois installé. */
  if(window.CoachCalliTimer && typeof window.CoachCalliTimer.start==="function"){
    try{ window.CoachCalliTimer.start(sec, "Repos Coach Calli"); return; }catch(e){}
  }
  /* 2) Plugin Capacitor enregistré (variante d'exposition du pont). */
  if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CoachCalliTimer){
    try{ window.Capacitor.Plugins.CoachCalliTimer.start({seconds:sec, message:"Repos Coach Calli"}); return; }catch(e){}
  }
  /* 3) Repli navigateur (PWA hors app) : l'ancien intent Chrome. */
  try{ window.location.href=androidTimerUrl(sec); }catch(e){}
}

function runShortcut(sec){
  var url="shortcuts://run-shortcut?name="+encodeURIComponent(SHORTCUT_NAME)+"&input=text&text="+sec;
  window.location.href=url;
}


function render(){
  var html="";
  if(STATE.detail){ html=viewDetail(STATE.detail); }
  else if(STATE.session){ html=viewSession(STATE.session); }
  else if(STATE.tab==="home"){ html=viewHome(); }
  else if(STATE.tab==="progress"){ html=viewProgress(); }
  else if(STATE.tab==="guide"){ html=viewGuide(); }
  else if(STATE.tab==="body"){ html=viewBody(); }
  if(!STATE.detail){ html+=tabbar(); }
  if(STATE.showShortcut!=null){ html+=shortcutOverlay(STATE.showShortcut); }
  app.innerHTML=html;
  bind();
  if(STATE.showShortcut==null) window.scrollTo(0,0);
}

/* ================= SEANCE ================= */
function sessionProgress(k){
  var s=PROGRAM[k];
  var done=0;
  s.exercises.forEach(function(ex){ if(doneToday(ex.id)) done++; });
  return {done:done,total:s.exercises.length};
}

function viewSession(k){
  var s=PROGRAM[k];
  var pr=sessionProgress(k);
  var pct=pr.total?Math.round(100*pr.done/pr.total):0;
  var complete=pr.done===pr.total;

  var h="<div class='fade'>"+header(s.color,s.name,s.day+" · "+s.focus);

  /* Bandeau de progression collant sous l'en-tête */
  h+="<div data-sessbar='1' style='position:sticky;top:0;z-index:9;background:"+C.bg+";padding:10px 16px 12px;border-bottom:1px solid "+C.line+"'>";
  h+="<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px'>";
  h+="<span data-sesslbl='1' style='font-size:12.5px;font-weight:700;color:"+(complete?s.color:C.text)+"'>"+(complete?"Séance complète ✓":"Progression de la séance")+"</span>";
  h+="<span data-sesscnt='1' style='font-size:12.5px;font-weight:800;color:"+s.color+";font-variant-numeric:tabular-nums'>"+pr.done+"/"+pr.total+"</span>";
  h+="</div>";
  h+="<div style='height:6px;background:"+C.panel2+";border-radius:6px;overflow:hidden'><div data-sessfill='1' style='height:100%;width:"+pct+"%;background:"+s.color+";border-radius:6px;transition:width .3s ease'></div></div>";
  h+="</div>";

  h+="<div style='padding:12px 16px 20px'>";
  s.exercises.forEach(function(ex){ h+=exerciseCard(ex,k,s.color); });
  h+="</div></div>";
  return h;
}

function doneToday(id){
  var e=(LOGS[id]||[]);
  var last=e[e.length-1];
  return !!(last && last.date===todayStr());
}
function frShort(iso){ var p=iso.split("-"); return p[2]+"/"+p[1]; }

    var dateTxt=isToday?"aujourd'hui":"le "+frShort(last.date);
    var lineColor=isToday?color:C.dim;
    h+="<div style='padding:0 15px 10px "+(done?"18px":"15px")+";font-size:12px;color:"+C.dim+";display:flex;align-items:center;gap:6px;flex-wrap:wrap'>"+icon("checkcircle",14,lineColor)+" Dernière fois : <b style='color:"+C.text+"'>"+formatEntry(last,ex.track)+"</b> <span style='color:"+lineColor+";font-weight:600'>· "+dateTxt+"</span></div>";

  h+="</div>";

/* Convertit un hex en rgba pour les fonds teintés */
function hexA(hex,a){
  var c=hex.replace("#","");
  if(c.length===3){ c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2]; }
  var r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}

function restSeconds(ex){
  var r=(ex.rest||"").toLowerCase();
  if(r.indexOf("2 min")>=0) return 120;
  var m=r.match(/(\d+)\s*s/); if(m) return parseInt(m[1],10);
  return 0;
}

/* Nombre de lignes de séries actuellement affichées dans le formulaire d'un exo */
var FORM_ROWS={};

function seriesRow(ex,color,i){
  var unit=(ex.track==="poids")?"Charge (kg)":(ex.track==="assist")?"Contrepoids (kg)":"";
  var h="<div class='serie-row' data-serie='"+i+"' style='display:flex;gap:8px;align-items:flex-end;margin-bottom:8px'>";
  h+="<div style='flex:0 0 26px;text-align:center;color:"+C.dim+";font-size:12px;font-weight:800;padding-bottom:11px'>"+(i+1)+"</div>";
  if(ex.track==="poids"||ex.track==="assist"){
    h+="<div style='flex:1'><label class='lab'>"+unit+"</label><input class='input' type='number' inputmode='decimal' data-load placeholder='—'></div>";
    h+="<div style='flex:1'><label class='lab'>Reps</label><input class='input' type='number' inputmode='numeric' data-reps placeholder='—'></div>";
  } else if(ex.track==="elastique"){
    h+="<div style='flex:1'><label class='lab'>Niveau</label><select class='input' data-lvl style='height:44px'>";
    ELASTIC_LEVELS.forEach(function(lv,j){ h+="<option value='"+j+"'"+(j===2?" selected":"")+">"+lv+"</option>"; });
    h+="</select></div>";
    h+="<div style='flex:0 0 90px'><label class='lab'>Reps</label><input class='input' type='number' inputmode='numeric' data-reps placeholder='—'></div>";
  } else {
    h+="<div style='flex:1'><label class='lab'>Reps / secondes</label><input class='input' type='number' inputmode='numeric' data-reps placeholder='—'></div>";
  }
  h+="<button class='press' data-serie-del='"+i+"' style='flex:0 0 40px;height:44px;background:none;border:1px solid "+C.line+";border-radius:10px;color:"+C.dim+";display:grid;place-items:center'>"+icon("x",15,C.dim)+"</button>";
  h+="</div>";
  return h;
}

function entryForm(ex,k,color){
  var nrows=FORM_ROWS[ex.id]!=null?FORM_ROWS[ex.id]:(ex.sets||1);
  if(nrows<1) nrows=1;
  FORM_ROWS[ex.id]=nrows;

  var h="<div style='padding:14px 15px;background:"+C.panel2+";border-top:1px solid "+C.line+"'>";
  h+="<div style='font-size:11px;color:"+C.dim+";text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:10px'>Tes séries — objectif "+ex.sets+" × "+ex.reps+"</div>";
  h+="<div data-series-zone='"+ex.id+"'>";
  for(var i=0;i<nrows;i++){ h+=seriesRow(ex,color,i); }
  h+="</div>";
  if(ex.track==="assist"){ h+="<div style='font-size:11px;color:"+C.dim+";margin:2px 0 10px;line-height:1.45'>Note le contrepoids affiché sur la machine. Plus il baisse, plus tu progresses.</div>"; }
  h+="<button class='press' data-serie-add='"+ex.id+"' style='width:100%;margin-top:2px;background:none;border:1px dashed "+C.line+";color:"+C.dim+";border-radius:10px;padding:10px 0;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px'>"+icon("plus",14,C.dim)+" Ajouter une série</button>";
  h+="<button class='press' data-save='"+ex.id+"' style='width:100%;margin-top:12px;background:"+color+";color:"+C.bg+";border:none;border-radius:10px;padding:13px 0;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px'>"+icon("check",18,C.bg)+" Enregistrer la séance</button>";

  var rs=restSeconds(ex);
  if(rs){
    var clockLabel = IS_ANDROID ? "Minuteur Horloge" : (IS_IOS ? "Minuteur iPhone" : "Minuteur");
    var btnStyle="width:100%;margin-top:10px;background:none;border:1px solid "+color+";color:"+color+";border-radius:10px;padding:12px 0;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;-webkit-tap-highlight-color:transparent";
    if(IS_ANDROID && !inNativeApp()){
      /* PWA dans Chrome : lien direct vers l'intent, le tap EST le geste exigé. */
      h+="<a class='press' href=\""+androidTimerUrl(rs)+"\" style='"+btnStyle+"'>"+icon("bell",17,color)+" "+clockLabel+" "+ex.rest+"</a>";
    } else {
      /* App native (Android/iOS) : bouton JS qui passe par le pont natif. */
      h+="<button class='press' data-nativerest='"+rs+"' style='"+btnStyle+"'>"+icon("bell",17,color)+" "+clockLabel+" "+ex.rest+"</button>";
    }
    var note = IS_ANDROID
      ? "Lance le minuteur de l'app Horloge : chrono visible sur l'écran verrouillé et sonnerie garantie."
      : (IS_IOS
        ? "Lance le minuteur de l'app Horloge iPhone : chrono sur l'écran verrouillé et son garanti."
        : "Lance le minuteur de l'app Horloge de ton téléphone.");
    h+="<div style='font-size:10.5px;color:"+C.dim+";margin-top:6px;line-height:1.45;text-align:center'>"+note+"</div>";
  }
  h+="</div>";
  return h;

function historyBlock(ex){

}

function historyList(ex){
  var entries=LOGS[ex.id]||[];
  var rev=entries.slice().reverse();
  var h="<div style='padding:0 15px 12px'>";
  rev.forEach(function(e,i){
    var realIdx=entries.length-1-i;
    h+="<div style='padding:8px 0;border-bottom:"+(i<rev.length-1?"1px solid "+C.line:"none")+"'>";

    if(e.sets && e.sets.length>1){
      var best=e.best||bestSet(e.sets,ex.track);
      h+="<div style='display:flex;flex-wrap:wrap;gap:5px;margin-top:6px'>";
      e.sets.forEach(function(s,si){

      });
      h+="</div>";
    }
    h+="</div>";
  });
  return h+"</div>";
}

function chartBlock(id){
  var ex=ALL[id]; var entries=LOGS[id]||[]; var track=ex.track;
  if(entries.length===0){ return emptyChart(ex); }
  var vals=entries.map(function(e){ return track==="poids"?e.load:track==="assist"?e.load:track==="elastique"?e.levelIdx:e.reps; });
  var yLabel=track==="poids"?"Charge (kg)":track==="assist"?"Contrepoids d'aide (kg)":track==="elastique"?"Niveau élastique":"Reps / secondes";
  var invert=(track==="assist");
  var delta=vals.length>1?vals[vals.length-1]-vals[0]:0;
  var good=invert?(delta<0):(delta>0);
  var deltaColor=delta===0?C.dim:(good?C.ok:C.red);
  var deltaTxt="";
  if(vals.length>1){
    if(track==="assist") deltaTxt=delta<0?"↓ "+Math.abs(delta)+" kg d'aide en moins":delta>0?"↑ +"+delta+" kg d'aide":"stable";
    else if(track==="elastique") deltaTxt=delta>0?"↑ "+delta+" niveau(x) plus dur":delta<0?"↓ "+Math.abs(delta):"stable";
    else deltaTxt=delta>0?"↑ +"+delta:delta<0?"↓ "+delta:"stable";
  }
  var h="<div style='background:"+C.panel+";border:1px solid "+C.line+";border-radius:18px;padding:16px 12px 12px;margin-top:8px'>";
  h+="<div style='display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 4px'><div style='font-size:12px;color:"+C.dim+"'>"+yLabel+"</div>"+(deltaTxt?"<div style='font-size:13px;font-weight:700;color:"+deltaColor+"'>"+deltaTxt+"</div>":"")+"</div>";
  h+="<div style='font-size:10.5px;color:"+C.dim+";padding:0 6px 10px'>Meilleure série de chaque séance</div>";
  h+=svgChart(entries,track,ex.sessionColor,id);
  if(track==="assist"){ h+="<div style='font-size:11px;color:"+C.dim+";padding:8px 8px 2px;line-height:1.45'>Ici, <b style='color:"+C.text+"'>plus la courbe descend, mieux c'est</b> : tu as besoin de moins d'aide. La ligne pointillée marque le seuil de 15 kg — à ce niveau, tu peux tenter ta première traction stricte.</div>"; }
  if(track==="elastique"){ h+="<div style='font-size:11px;color:"+C.dim+";padding:8px 8px 2px;line-height:1.45'>Plus la courbe monte, moins tu as besoin de l'élastique — tu te rapproches de la traction stricte.</div>"; }
  h+="</div>";
  h+=statRow(entries,track,ex.sessionColor);
  return h;
}

function svgChart(entries,track,color,id){
  var W=436,H=210,padL=36,padR=14,padT=14,padB=28;
  var vals=entries.map(function(e){ return track==="poids"?e.load:track==="assist"?e.load:track==="elastique"?e.levelIdx:e.reps; });
  var n=vals.length, minV,maxV;
  if(track==="elastique"){ minV=0;maxV=5; }
  else{
    minV=Math.min.apply(null,vals); maxV=Math.max.apply(null,vals);
    if(track==="assist"){ minV=Math.min(minV,10); maxV=Math.max(maxV,45); }
    if(minV===maxV){ minV=Math.max(0,minV-2); maxV=maxV+2; }
    else { var pd=(maxV-minV)*0.15; minV=Math.max(0,minV-pd); maxV=maxV+pd; }
  }
  var plotW=W-padL-padR, plotH=H-padT-padB;
  function xOf(i){ return n<=1?padL+plotW/2:padL+(plotW*i/(n-1)); }
  function yOf(v){ return padT+plotH*(1-(v-minV)/((maxV-minV)||1)); }
  var svg="<svg viewBox='0 0 "+W+" "+H+"' width='100%' style='display:block'>";
  var gridVals=[];
  if(track==="elastique"){ gridVals=[0,1,2,3,4,5]; }
  else { for(var gi=0;gi<=4;gi++){ gridVals.push(minV+(maxV-minV)*gi/4); } }
  gridVals.forEach(function(gv){
    var y=yOf(gv);
    svg+="<line x1='"+padL+"' y1='"+y+"' x2='"+(W-padR)+"' y2='"+y+"' stroke='"+C.line+"' stroke-width='1' stroke-dasharray='3 3'/>";
    var lbl=track==="elastique"?gv:(Math.round(gv*10)/10);
    svg+="<text x='"+(padL-6)+"' y='"+(y+4)+"' fill='"+C.dim+"' font-size='10' text-anchor='end'>"+lbl+"</text>";
  });
  if(track==="assist" && 15>=minV && 15<=maxV){
    var yT=yOf(15);
    svg+="<line x1='"+padL+"' y1='"+yT+"' x2='"+(W-padR)+"' y2='"+yT+"' stroke='"+C.ok+"' stroke-width='1.5' stroke-dasharray='6 4'/>";
    svg+="<text x='"+(W-padR-2)+"' y='"+(yT-6)+"' fill='"+C.ok+"' font-size='10' text-anchor='end' font-weight='700'>seuil traction</text>";
  }
  if(n>=1){
    var d="";
    entries.forEach(function(e,i){ var x=xOf(i),y=yOf(vals[i]); d+=(i===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1)+" "; });
    if(n>1){ svg+="<path d='"+d+"' fill='none' stroke='"+color+"' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>"; }
    entries.forEach(function(e,i){ var x=xOf(i),y=yOf(vals[i]); svg+="<circle cx='"+x.toFixed(1)+"' cy='"+y.toFixed(1)+"' r='4' fill='"+color+"'/>"; });
    var step=Math.ceil(n/6);
    entries.forEach(function(e,i){ if(i%step===0||i===n-1){ var x=xOf(i); svg+="<text x='"+x.toFixed(1)+"' y='"+(H-8)+"' fill='"+C.dim+"' font-size='10' text-anchor='middle'>"+frDate(e.date).slice(0,5)+"</text>"; } });
  }
  return svg+"</svg>";
}

function statRow(entries,track,color){
  var weeks={}; entries.forEach(function(e){ weeks[e.week]=1; });
  var best;
  if(track==="poids") best=Math.max.apply(null,entries.map(function(e){return e.load;}))+" kg";
  else if(track==="assist") best=Math.min.apply(null,entries.map(function(e){return e.load;}))+" kg";
  else if(track==="elastique") best=ELASTIC_LEVELS[Math.max.apply(null,entries.map(function(e){return e.levelIdx;}))];
  else best=Math.max.apply(null,entries.map(function(e){return e.reps;}));
  var lbl=track==="assist"?"Meilleur (min)":track==="elastique"?"Meilleur niveau":"Record";
  var small=(track==="elastique");
  var stats=[["Séances",entries.length],["Semaines",Object.keys(weeks).length],[lbl,best]];
  var h="<div style='display:flex;gap:10px;margin-top:14px'>";
  stats.forEach(function(st,i){
    var big=!(small&&i===2);
    h+="<div style='flex:1;background:"+C.panel+";border:1px solid "+C.line+";border-radius:14px;padding:13px 8px;text-align:center'><div style='font-size:"+(big?20:11.5)+"px;font-weight:800;color:"+color+";line-height:1.2'>"+st[1]+"</div><div style='font-size:10.5px;color:"+C.dim+";text-transform:uppercase;letter-spacing:.5px;margin-top:3px'>"+st[0]+"</div></div>";
  });
  return h+"</div>";
}

function bodyChart(pts,key,color){
  var W=436,H=200,padL=40,padR=14,padT=14,padB=28;
  var vals=pts.map(function(p){ return p[key]; });
  var n=vals.length;
  var minV=Math.min.apply(null,vals), maxV=Math.max.apply(null,vals);
  if(minV===maxV){ minV=minV-1.5; maxV=maxV+1.5; } else { var pd=(maxV-minV)*0.18; minV=minV-pd; maxV=maxV+pd; }
  var plotW=W-padL-padR, plotH=H-padT-padB;
  function xOf(i){ return n<=1?padL+plotW/2:padL+(plotW*i/(n-1)); }
  function yOf(v){ return padT+plotH*(1-(v-minV)/((maxV-minV)||1)); }
  var svg="<svg viewBox='0 0 "+W+" "+H+"' width='100%' style='display:block'>";
  for(var gi=0;gi<=4;gi++){
    var gv=minV+(maxV-minV)*gi/4, y=yOf(gv);
    svg+="<line x1='"+padL+"' y1='"+y+"' x2='"+(W-padR)+"' y2='"+y+"' stroke='"+C.line+"' stroke-width='1' stroke-dasharray='3 3'/>";
    svg+="<text x='"+(padL-6)+"' y='"+(y+4)+"' fill='"+C.dim+"' font-size='10' text-anchor='end'>"+(Math.round(gv*10)/10)+"</text>";
  }
  var d="",ar="";
  pts.forEach(function(p,i){ var x=xOf(i),y=yOf(vals[i]); d+=(i===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1)+" "; });
  if(n>1){
    ar=d+"L"+xOf(n-1).toFixed(1)+" "+(H-padB)+" L"+xOf(0).toFixed(1)+" "+(H-padB)+" Z";
    svg+="<path d='"+ar+"' fill='"+color+"' opacity='.10'/>";
    svg+="<path d='"+d+"' fill='none' stroke='"+color+"' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>";
  }
  pts.forEach(function(p,i){ var x=xOf(i),y=yOf(vals[i]); svg+="<circle cx='"+x.toFixed(1)+"' cy='"+y.toFixed(1)+"' r='4' fill='"+color+"'/>"; });
  var step=Math.ceil(n/6);
  pts.forEach(function(p,i){ if(i%step===0||i===n-1){ var x=xOf(i); svg+="<text x='"+x.toFixed(1)+"' y='"+(H-8)+"' fill='"+C.dim+"' font-size='10' text-anchor='middle'>"+frDate(p.date).slice(0,5)+"</text>"; } });
  return svg+"</svg>";
}

  h+="<div style='display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap'><span class='chip'>"+ex.sets+" séries</span><span class='chip'>"+ex.reps+" reps</span><span class='chip'>Repos "+ex.rest+"</span><span class='chip' style='color:"+meta.tint+"'>"+meta.label+"</span></div>";
  h+="<div style='margin-bottom:22px'><div style='display:flex;align-items:center;gap:8px;margin-bottom:12px'>"+icon("checkcircle",19,C.ok)+"<h3 style='margin:0;font-size:16px;font-weight:800'>Comment bien faire</h3></div><ul style='margin:0;padding:0;list-style:none'>";
  ex.how.forEach(function(t,i){ h+="<li style='margin-bottom:9px;line-height:1.5;font-size:14px'><span style='color:"+C.ok+";font-weight:700;margin-right:6px'>"+(i+1)+".</span>"+t+"</li>"; });
  h+="</ul></div>";
  h+="<div style='margin-bottom:22px'><div style='display:flex;align-items:center;gap:8px;margin-bottom:12px'>"+icon("warn",19,C.red)+"<h3 style='margin:0;font-size:16px;font-weight:800'>Erreurs à éviter</h3></div><ul style='margin:0;padding:0;list-style:none'>";
  ex.avoid.forEach(function(t){ h+="<li style='margin-bottom:9px;line-height:1.5;font-size:14px;display:flex;gap:8px'><span style='color:"+C.red+";flex-shrink:0;margin-top:1px'>✕</span><span>"+t+"</span></li>"; });
  h+="</ul></div>";
  if(entries.length>0){
    var l=entries[entries.length-1];
    h+="<div style='background:"+C.panel2+";border:1px solid "+C.line+";border-radius:14px;padding:14px'><div style='font-size:12px;color:"+C.dim+";margin-bottom:6px;font-weight:600'>Ta dernière performance</div><div style='font-size:16px;font-weight:700;color:"+color+"'>"+formatEntry(l,ex.track)+"<span style='color:"+C.dim+";font-weight:400;font-size:12px;margin-left:8px'>le "+frDate(l.date)+"</span></div></div>";
  }
  h+="</div></div>";
  return h;
}

/* ================= BINDINGS ================= */
var OPEN_FORM=null, OPEN_HIST={}, FORM_LEVEL={};

function bind(){
  app.querySelectorAll("[data-tab]").forEach(function(b){ b.onclick=function(){ go({tab:b.getAttribute("data-tab"),session:null,detail:null}); }; });
  app.querySelectorAll("[data-back]").forEach(function(b){ b.onclick=function(){
    OPEN_FORM=null;
    if(STATE.detail && STATE.session){ go({detail:null}); }        // retour à la séance en cours
    else if(STATE.detail){ go({detail:null}); }                    // retour à l'onglet (guide/évolution)
    else { go({session:null,detail:null}); }                       // quitter une séance -> accueil
  }; });
  app.querySelectorAll("[data-session]").forEach(function(b){ b.onclick=function(){ OPEN_FORM=null;OPEN_HIST={}; go({session:b.getAttribute("data-session")}); }; });
  app.querySelectorAll("[data-detail]").forEach(function(b){ b.onclick=function(){ go({detail:b.getAttribute("data-detail")}); }; });
  app.querySelectorAll("[data-psel]").forEach(function(b){ b.onclick=function(){ STATE.progressSel=b.getAttribute("data-psel"); render(); }; });
  app.querySelectorAll("[data-gosession]").forEach(function(b){ b.onclick=function(){ OPEN_FORM=null;OPEN_HIST={}; go({session:b.getAttribute("data-gosession"),detail:null}); }; });
  app.querySelectorAll("[data-bmetric]").forEach(function(b){ b.onclick=function(){ STATE.bodyMetric=b.getAttribute("data-bmetric"); render(); }; });
  app.querySelectorAll("[data-toggle]").forEach(function(b){ b.onclick=function(){ var id=b.getAttribute("data-toggle"); OPEN_FORM=(OPEN_FORM===id)?null:id; refreshCard(id); }; });
  app.querySelectorAll("[data-hist]").forEach(function(b){ b.onclick=function(){ var id=b.getAttribute("data-hist"); OPEN_HIST[id]=!OPEN_HIST[id]; refreshCard(id); }; });
  app.querySelectorAll("[data-wk]").forEach(function(b){ b.onclick=function(){ var d=parseInt(b.getAttribute("data-wk"),10); META.week=Math.max(1,(META.week||1)+d); saveMeta(); render(); }; });
  var ex=app.querySelector("[data-export]"); if(ex) ex.onclick=doExport;
  var im=app.querySelector("[data-import]"); if(im) im.onclick=function(){ var f=document.getElementById("importfile"); if(f) f.click(); };
  var imf=document.getElementById("importfile"); if(imf) imf.onchange=doImport;
  var si=app.querySelector("[data-signin]"); if(si) si.onclick=doSignIn;
  var so=app.querySelector("[data-signout]"); if(so) so.onclick=function(){ if(confirm("Te déconnecter ? Tes données restent sauvegardées dans le cloud et sur cet appareil.")) doSignOut(); };
  paintSyncBadge();
  var bs=document.getElementById("bsave"); if(bs) bs.onclick=saveBodyEntry;
  app.querySelectorAll("[data-bdel]").forEach(function(b){ b.onclick=function(){ BODY.splice(parseInt(b.getAttribute("data-bdel"),10),1); saveBody(); render(); }; });
  var scr=app.querySelector("[data-shortcut-ready]"); if(scr) scr.onclick=function(){ var sec=parseInt(scr.getAttribute("data-shortcut-ready"),10); META.shortcutReady=true; saveMeta(); STATE.showShortcut=null; runShortcut(sec); render(); };
  var scc=app.querySelector("[data-shortcut-close]"); if(scc) scc.onclick=function(){ STATE.showShortcut=null; render(); };
  bindCardInner();
}

function bindCardInner(){
  /* Ajouter une série : on incrémente le compteur et on réinjecte le formulaire
     en préservant les valeurs déjà saisies. */
  app.querySelectorAll("[data-serie-add]").forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute("data-serie-add");
      var vals=readSeriesInputs(id);
      FORM_ROWS[id]=(FORM_ROWS[id]||ALL[id].sets||1)+1;
      rebuildForm(id,vals);
    };
  });
  app.querySelectorAll("[data-serie-del]").forEach(function(b){
    b.onclick=function(){
      var row=b.closest(".serie-row"), zoneEl=b.closest("[data-series-zone]");
      var id=zoneEl.getAttribute("data-series-zone");
      if(zoneEl.querySelectorAll(".serie-row").length<=1) return; // garde au moins 1 ligne
      var vals=readSeriesInputs(id);
      var idx=parseInt(row.getAttribute("data-serie"),10);
      vals.splice(idx,1);
      FORM_ROWS[id]=Math.max(1,(FORM_ROWS[id]||1)-1);
      rebuildForm(id,vals);
    };
  });
  app.querySelectorAll("[data-save]").forEach(function(b){ b.onclick=function(){ armAudio(); saveEntry(b.getAttribute("data-save")); }; });
  app.querySelectorAll("[data-nativerest]").forEach(function(b){ b.onclick=function(){ openNativeTimer(parseInt(b.getAttribute("data-nativerest"),10)); }; });
  app.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick=function(){
      var parts=b.getAttribute("data-del").split(":"), id=parts[0], idx=parseInt(parts[1],10);
      (LOGS[id]||[]).splice(idx,1); if(LOGS[id]&&LOGS[id].length===0){ delete LOGS[id]; }
      saveLogs();
      var ex=ALL[id], card=app.querySelector("[data-card='"+id+"']");
      if(card){ OPEN_HIST[id]=false; card.outerHTML=exerciseCard(ex,ex.sessionKey,ex.sessionColor); updateSessionBar(ex.sessionKey); bind(); }
      else { render(); }
    };
  });
}

/* Lit les valeurs actuelles des lignes de séries d'un exo (pour ne rien perdre au rebuild) */
function readSeriesInputs(id){
  var ex=ALL[id];
  var zone=app.querySelector("[data-series-zone='"+id+"']");
  var out=[];
  if(!zone) return out;
  zone.querySelectorAll(".serie-row").forEach(function(row){
    var v={};
    var l=row.querySelector("[data-load]"); if(l) v.load=l.value;
    var r=row.querySelector("[data-reps]"); if(r) v.reps=r.value;
    var lv=row.querySelector("[data-lvl]"); if(lv) v.levelIdx=lv.value;
    out.push(v);
  });
  return out;
}

/* Réinjecte le formulaire d'un exo et restaure les valeurs saisies */
function rebuildForm(id,vals){
  var ex=ALL[id], card=app.querySelector("[data-card='"+id+"']");
  var fz=card.querySelector("[data-form='"+id+"']");
  fz.innerHTML=entryForm(ex,ex.sessionKey,ex.sessionColor);
  var zone=fz.querySelector("[data-series-zone='"+id+"']");
  if(zone && vals){
    zone.querySelectorAll(".serie-row").forEach(function(row,i){
      if(!vals[i]) return;
      var l=row.querySelector("[data-load]"); if(l&&vals[i].load!=null) l.value=vals[i].load;
      var r=row.querySelector("[data-reps]"); if(r&&vals[i].reps!=null) r.value=vals[i].reps;
      var lv=row.querySelector("[data-lvl]"); if(lv&&vals[i].levelIdx!=null) lv.value=vals[i].levelIdx;
    });
  }
  bindCardInner();
}

function refreshCard(id){
  var card=app.querySelector("[data-card='"+id+"']");
  if(!card){ render(); return; }
  var ex=ALL[id], k=ex.sessionKey, color=ex.sessionColor;
  var fz=card.querySelector("[data-form='"+id+"']");
  if(OPEN_FORM===id){ fz.classList.remove("hidden"); fz.innerHTML=entryForm(ex,k,color); if(FORM_LEVEL[id]==null) FORM_LEVEL[id]=2; }
  else { fz.classList.add("hidden"); fz.innerHTML=""; }
  var tog=card.querySelector("[data-toggle='"+id+"']");
  if(tog){ tog.innerHTML=(OPEN_FORM===id?icon("x",15,C.text):icon("plus",15,color))+(OPEN_FORM===id?" Fermer":" Noter"); tog.style.color=OPEN_FORM===id?C.text:color; tog.style.background=OPEN_FORM===id?C.panel2:"none"; }
  var hz=card.querySelector("[data-histzone='"+id+"']");
  if(hz){ if(OPEN_HIST[id]){ hz.classList.remove("hidden"); hz.innerHTML=historyList(ex); } else { hz.classList.add("hidden"); hz.innerHTML=""; } }
  var hb=card.querySelector("[data-hist='"+id+"']");
  if(hb){ hb.textContent="Historique ("+((LOGS[id]||[]).length)+")"; }
  bindCardInner();
}

/* Détermine la meilleure série d'un ensemble, selon le type d'exercice.
   poids : charge la plus lourde (puis reps). assist : contrepoids le plus BAS
   (puis reps). elastique : niveau le plus dur = index le plus élevé (puis reps).
   gainage : reps/durée la plus élevée. */
function bestSet(sets,track){
  if(!sets||!sets.length) return null;
  var best=sets[0];
  sets.forEach(function(s){
    if(track==="poids"){ if(s.load>best.load||(s.load===best.load&&s.reps>best.reps)) best=s; }
    else if(track==="assist"){ if(s.load<best.load||(s.load===best.load&&s.reps>best.reps)) best=s; }
    else if(track==="elastique"){ if(s.levelIdx>best.levelIdx||(s.levelIdx===best.levelIdx&&s.reps>best.reps)) best=s; }
    else { if(s.reps>best.reps) best=s; }
  });
  return best;
}

/* Valeur numérique d'une entrée pour les graphiques (basée sur la meilleure série) */
function entryValue(e,track){
  var b=e.best||e; // rétrocompat : anciennes entrées sans .best
  if(track==="poids"||track==="assist") return b.load;
  if(track==="elastique") return b.levelIdx;
  return b.reps;
}

function saveEntry(id){
  var ex=ALL[id], k=ex.sessionKey;
  var card=app.querySelector("[data-card='"+id+"']");
  var fz=card.querySelector("[data-form='"+id+"']");
  var zone=fz.querySelector("[data-series-zone='"+id+"']");
  var rows=zone?zone.querySelectorAll(".serie-row"):[];
  var sets=[];
  for(var i=0;i<rows.length;i++){
    var row=rows[i];
    var repsEl=row.querySelector("[data-reps]");
    var reps=repsEl?repsEl.value:"";
    if(reps==="") continue; // on ignore les séries laissées vides
    if(ex.track==="poids"||ex.track==="assist"){
      var loadEl=row.querySelector("[data-load]"); var load=loadEl?loadEl.value:"";
      if(load==="") continue;
      sets.push({load:Number(load),reps:Number(reps)});
    } else if(ex.track==="elastique"){
      var lvlEl=row.querySelector("[data-lvl]"); var lvl=lvlEl?parseInt(lvlEl.value,10):2;
      sets.push({levelIdx:lvl,level:ELASTIC_LEVELS[lvl],reps:Number(reps)});
    } else {
      sets.push({reps:Number(reps)});
    }
  }
  if(sets.length===0) return; // rien de valide à enregistrer

  var best=bestSet(sets,ex.track);
  var entry={date:todayStr(),session:k,week:isoWeek(todayStr()),sets:sets,best:best};
  /* On copie aussi les champs de la meilleure série au niveau racine :
     rétrocompatibilité avec l'ancien affichage et la fusion Firebase. */
  if(ex.track==="poids"||ex.track==="assist"){ entry.load=best.load; entry.reps=best.reps; }
  else if(ex.track==="elastique"){ entry.levelIdx=best.levelIdx; entry.level=best.level; entry.reps=best.reps; }
  else { entry.reps=best.reps; }

  if(!LOGS[id]) LOGS[id]=[];
  LOGS[id].push(entry);
  saveLogs();
  OPEN_FORM=null;
  FORM_ROWS[id]=null;
  if(navigator.vibrate) navigator.vibrate(45);
  card.outerHTML=exerciseCard(ex,k,ex.sessionColor);
  updateSessionBar(k);
  bind();
}

/* Recalcule le bandeau de progression sans re-rendre toute la page */
function updateSessionBar(k){
  if(STATE.session!==k) return;
  var pr=sessionProgress(k), s=PROGRAM[k];
  var pct=pr.total?Math.round(100*pr.done/pr.total):0;
  var complete=pr.done===pr.total;
  var bar=app.querySelector("[data-sessbar]");
  var fill=app.querySelector("[data-sessfill]");
  var lbl=app.querySelector("[data-sesslbl]");
  var cnt=app.querySelector("[data-sesscnt]");
  if(fill) fill.style.width=pct+"%";
  if(cnt) cnt.textContent=pr.done+"/"+pr.total;
  if(lbl){ lbl.textContent=complete?"Séance complète ✓":"Progression de la séance"; lbl.style.color=complete?s.color:C.text; }
}

function saveBodyEntry(){
  var w=document.getElementById("bw").value, t=document.getElementById("bt").value;
  if(w===""&&t==="") return;
  var d=todayStr();
  var existing=null;
  BODY.forEach(function(b){ if(b.date===d) existing=b; });
  if(!existing){ existing={date:d,weight:null,waist:null}; BODY.push(existing); }
  if(w!=="") existing.weight=Number(w);
  if(t!=="") existing.waist=Number(t);
  BODY.sort(function(a,b){ return a.date<b.date?-1:1; });
  saveBody();
  if(navigator.vibrate) navigator.vibrate(45);
  render();
}

function doExport(){
  var payload={exportedAt:new Date().toISOString(),meta:META,logs:LOGS,body:BODY};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="coach-calli-sauvegarde.json";
  a.click();
}

function doImport(ev){
  var file=ev.target.files && ev.target.files[0];
  if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var p=JSON.parse(rd.result);
      var nLogs=p.logs||{}, nBody=p.body||[];
      var addedL=0;
      Object.keys(nLogs).forEach(function(k){ addedL+=(nLogs[k]||[]).length; });
      LOGS=mergeLogs(LOGS,nLogs);
      BODY=mergeBody(BODY,nBody);
      if(p.meta && p.meta.week) META.week=Math.max(META.week||1,p.meta.week);
      persist();
      render();
      alert("Import réussi : "+addedL+" entrée(s) d'exercice et "+nBody.length+" mesure(s) fusionnées.");
    }catch(e){
      alert("Fichier illisible. Vérifie que c'est bien un export de l'application (.json).");
    }
    ev.target.value="";
  };
  rd.readAsText(file);
}

render();
initCloud();
</script>
